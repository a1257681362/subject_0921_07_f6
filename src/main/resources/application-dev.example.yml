spring:
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

# 无状态会话（JWT）。本机开发可留空 secret（每次启动随机、重启需重新登录）；
# 生产必须通过环境变量 AUTH_JWT_SECRET 注入固定 Base64 密钥（openssl rand -base64 32）。
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
